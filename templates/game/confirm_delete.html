<!-- templates/game/confirm_delete.html -->
{% extends "base.html" %}
{% block content %}
<h2>Supprimer {{ player.user.username }} ?</h2>
<p>⚠️ Cette action est irréversible.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" style="background:red;color:white;">Oui, supprimer</button>
    <a href="{% url 'player_profile' %}">Annuler</a>
</form>
{% endblock %}
